# Deploys the apex vrcverify.com (issue #88, phase 10).
#
# An ASSETS-ONLY Worker: there is no `main`, so no code runs on a request.
# Cloudflare serves the files in ./site and nothing else. That is the same
# thing Pages would have done -- Pages is simply no longer offered for new
# projects on this account, and the Workers flow expects `npx wrangler deploy`
# against a config in the repository.
#
# Keeping it in git rather than in a dashboard is the point: what is published
# at vrcverify.com, and from which directory, is reviewable in a diff.
#
# THIS DOES NOT SERVE THE DASHBOARD. dashboard.vrcverify.com is the Flask app
# on the VPS, reached through the cloudflared tunnel, and must stay that way --
# the separation is deliberate and SECURITY_AUDIT section 2 depends on it. Only
# the apex and www are bound here.

name = "vrcverify"
compatibility_date = "2026-08-18"

# NO SECOND COPY OF THIS SITE ON THE INTERNET (#170).
#
# Left unset, Cloudflare also serves this Worker at
# `vrcverify.<subdomain>.workers.dev`, and it did: that hostname answered 200
# with the whole marketing site, pill and all. Nothing secret is exposed -- it
# is the same public files -- but with no canonical tag, no robots meta and no
# robots.txt anywhere on this site, it was a fully indexable duplicate. Two
# URLs serving identical pages split ranking signals between them, and the one
# a search result shows might not be the one with the brand on it.
#
# The status Worker never had this problem, which is the tell: `status/
# wrangler.toml` declares its hostname in `[[routes]]`, and wrangler turns
# workers.dev off by itself when routes are configured. This file declares no
# routes, so it got the default.
#
# Kept explicit even though the routes below would switch it off anyway. The
# default is the thing that bit us, and a reader deleting a route block should
# not silently republish the site at a second address as a side effect.
workers_dev = false

[assets]
directory = "./site"

# A mistyped or rotted legal URL should land somewhere that says where to go
# instead. Stripe and Discord both hold links into this site, and neither will
# tell us if one stops resolving.
#
# KEEP THIS INSIDE [assets], which is less obvious than it looks. The first
# draft of the routes below was written between these two keys, and TOML read
# this line as part of the last [[routes]] table instead. Wrangler refused it,
# which was luck rather than design: the failure it saved was a 404 page that
# quietly stopped being served on the URLs Stripe holds.
not_found_handling = "404-page"

# WHERE THIS SITE IS ACTUALLY PUBLISHED (#259).
#
# Last in the file, because [[routes]] is a table array and everything after it
# belongs to it. See the note above.
#
# These two hostnames existed for weeks before this block did, as Custom
# Domains created by hand in Workers -> Settings -> Domains & Routes, exactly
# as site/README.md step 4 says to. Nothing in the repository recorded that,
# while the preamble above claimed what is published at vrcverify.com "is
# reviewable in a diff". It was not. Now it is.
#
# Declaring them changed nothing at the edge: both already pointed at THIS
# script, so wrangler adopts them rather than rebinding anything. Verified with
# `wrangler deploy --dry-run` before it was merged, because the warning in
# status/README.md -- that wrangler refuses a hostname that already exists --
# is about a hostname belonging to somebody ELSE, and it would have been easy
# to read it as forbidding this.
#
# WWW IS NOT REDUNDANT, WHICH IS THE TRAP HERE. A redirect rule sends
# www.vrcverify.com to the apex, so this Worker never serves a www request and
# the binding looks like dead weight. It is what makes www RESOLVE. Delete it
# and www stops existing, the redirect rule never runs because nothing reaches
# the edge, and every www link ever posted breaks. It stays.
[[routes]]
pattern = "vrcverify.com"
custom_domain = true

[[routes]]
pattern = "www.vrcverify.com"
custom_domain = true
