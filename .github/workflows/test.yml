# The tests on every pull request, and the deploy that follows them on main.
#
# THIS DID NOT EXIST UNTIL #297, and the gap was not that the status Worker's
# tests were missing: nothing ran at all. `codeql.yml` was the only workflow in
# this directory, so forty-five Python test files and six JavaScript ones
# passed or failed on one laptop and nowhere else, and a pull request that
# broke any of them merged green.
#
# FOUR JOBS, RUNNING IN PARALLEL AND FAILING INDEPENDENTLY, so a broken status
# page does not report itself as a Python failure. Two of them are the two
# toolchains; the third is the same Python suite again on Postgres, for the one
# class of bug SQLite cannot reproduce; the fourth assembles the Workers, which
# is a different question from whether their tests pass (#303). Each says why
# above itself.
#
# AND THEN A FIFTH, WHICH PUBLISHES (#305). It lives here rather than in a file
# of its own precisely so it can say `needs:` and mean it: a status page is the
# one surface where shipping something broken is worse than shipping nothing,
# so the deploy depends on the tests rather than racing them in a second
# workflow. See the note above the job.
name: Tests and deploy

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  # So a deploy can be re-run by hand without an empty commit, which is what
  # somebody will want at the exact moment they are least inclined to invent a
  # reason for one.
  workflow_dispatch:

# A second push to a pull request makes the first run irrelevant. Without this
# they both finish, and the older one can report after the newer.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The version the images run. Pinned to the minor, not the patch, so a
      # security release does not need a commit here -- but not left floating
      # to "3.x" either, because this suite imports bot.py, which imports
      # discord.py and SQLAlchemy, and a major that those have not caught up
      # with would fail as a mystery rather than as an upgrade.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: config/other_configs/requirements-dev.txt

      # requirements-dev.txt pulls in requirements.txt and the dashboard's,
      # deliberately, so that "a complete test environment" is one file. See
      # the comment at the top of it: tests/test_dashboard.py skips itself when
      # Flask is absent, and a skipped security test is not a passed one.
      - run: pip install -r config/other_configs/requirements-dev.txt

      # No credentials, and none are needed. conftest.py pins DATABASE_URL to
      # an in-memory SQLite and every other secret to a test value BEFORE any
      # module that reads them is imported, and `local_database_only` refuses
      # any database URL that is not loopback. The suite cannot reach anything
      # real from here even if this runner were given a way to.
      - run: pytest

  # THE SAME SUITE, ON POSTGRES. Not a duplicate run for its own sake: SQLite
  # is loosely typed and Postgres is not, so the fast job above structurally
  # cannot reproduce a disagreement about a column's TYPE. #164 reached
  # production through exactly that gap, with two regression tests passing over
  # it, and scripts/test_postgres.sh was written in #275 to close it. It was a
  # documented manual step, which means it ran when somebody remembered.
  #
  # WHY THIS CANNOT REACH THE REAL DATABASE, in three independent ways, because
  # the suite's teardown deletes rows and one of them being wrong is not
  # something to find out afterwards:
  #
  #   1. The database is a service container on this runner. It is created for
  #      this job, reachable only on localhost, and destroyed with it.
  #   2. conftest.local_database_only refuses any URL whose host is not
  #      loopback, as an allowlist rather than a denylist, and raises at import
  #      before a single test collects.
  #   3. bot.py refuses a non-SQLite URL on import (#273). conftest opens that
  #      guard ONLY after the loopback check has passed.
  #
  # And this job references no secret, so the runner holds no credential that
  # could reach anything real even if all three failed at once.
  postgres:
    name: pytest (postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        # The major production runs. The snapshot is a pg_dump from 15.8, and
        # loading a 15 dump into a later major is a different test from the one
        # this job is for.
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: test-only-not-a-secret
          POSTGRES_DB: vrcverify_test
        ports:
          - 5432:5432
        # Actions waits on this before running any step, so there is no sleep
        # here and no race. Postgres comes up, shuts down and comes up again
        # during initdb, which is what makes a fixed wait the wrong tool.
        options: >-
          --health-cmd "pg_isready -U postgres -d vrcverify_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: config/other_configs/requirements-dev.txt

      - run: pip install -r config/other_configs/requirements-dev.txt

      # Installed rather than assumed. `psql` does ship on ubuntu-latest today,
      # and a job that depends on what a runner image happens to preinstall
      # breaks silently the day that changes.
      - name: Install the psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      # SEEDED FROM THE DUMP, NOT FROM create_all(). A database built by
      # create_all() has the columns the models describe, which is the half of
      # the disagreement that was never in question -- it would not reproduce
      # #164 either. ON_ERROR_STOP so a snapshot that does not load fails here,
      # with the SQL error, rather than as a cascade of missing-table errors
      # inside pytest.
      - name: Load schema/production.sql
        run: psql -v ON_ERROR_STOP=1 -q -f schema/production.sql
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: test-only-not-a-secret
          PGDATABASE: vrcverify_test

      - run: pytest
        env:
          # 127.0.0.1 spelled out rather than "localhost", because the guard
          # this passes through parses the host out of this string and both
          # spellings should keep working -- but only one of them is what the
          # service is actually published on.
          VRCVERIFY_TEST_DATABASE_URL: postgresql://postgres:test-only-not-a-secret@127.0.0.1:5432/vrcverify_test

  javascript:
    name: node --test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # NO INSTALL STEP, and that is not an omission. status/package.json has
      # no dependencies on purpose (see status/README.md), the tests use the
      # standard library's test runner, and the Worker itself ships nothing but
      # its own source. Adding a lockfile install here would invent a supply
      # chain this surface does not have.
      #
      # These are the tests that matter most for the status page, because
      # status/src/render.js has no template files: every row of that page is a
      # JavaScript template string, and these six files are what stands between
      # an edit and a page that says the wrong thing about whether the product
      # is working.
      - run: node --test test/*.test.js
        working-directory: status

  # DOES IT ASSEMBLE AND WILL IT FIT, which is not what `node --test` answers
  # (#303).
  #
  # That job imports the modules one at a time under Node. A deploy hands the
  # graph to esbuild and the result to workerd, and nothing in this repository
  # was doing that: `status/wrangler.toml` is a separate script with a separate
  # deploy, deliberately, and no workflow mentioned it.
  #
  # WHY THE EXISTING GREEN CHECK IS NOT THIS. `Workers Builds: vrcverify` on
  # every pull request is CLOUDFLARE building the APEX Worker, which is
  # assets-only: it has no `main`, so there is nothing to bundle and the check
  # proves that ./site exists.
  #
  # WHAT THIS ACTUALLY BUYS, measured rather than assumed, because the first
  # draft of this job claimed three things that turned out to be false:
  #
  #   * The two wrangler.toml files are PARSED. Nothing else reads them. The
  #     apex one has a recorded near-miss -- a `[[routes]]` table array
  #     swallowing `not_found_handling`, which would have stopped serving the
  #     404 page on the URLs Stripe holds -- and wrangler refusing the file was
  #     the only thing that caught it.
  #   * The module graph is resolved BY ESBUILD, from `main`, on Linux. Today
  #     every module under status/src is also reachable from a test, so this
  #     overlaps the job above almost entirely. It stops overlapping the first
  #     time somebody adds a module only index.js imports, which is the shape
  #     #302 came in as.
  #
  # WHAT --dry-run DOES NOT DO, both verified by breaking them on purpose:
  # it bundles a `node:` built-in with no `nodejs_compat` flag and exits 0,
  # and it reported 8.8 MB gzipped without complaint. Neither is a deploy that
  # would succeed. The two steps after the build are those two gaps, closed
  # here rather than left as a claim in a comment.
  workers:
    name: wrangler --dry-run
    runs-on: ubuntu-latest
    env:
      # Wrangler asks to phone home on first run and waits for an answer.
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # NO CREDENTIALS, WHICH IS THE POINT OF --dry-run. It bundles and stops:
      # no account is read, no token is needed, nothing is published, and the
      # job therefore runs on a fork the same as it does here. If this ever
      # starts needing a secret, something has been added that is no longer a
      # build.
      #
      # `wrangler@4` rather than a pinned patch or a bare `wrangler`. The
      # README's deploy command is unpinned, so pinning tightly here would
      # test something other than what actually ships; the major is the line
      # where wrangler makes breaking changes, so it is where this stops
      # following along on its own.
      - name: Build the status Worker
        run: >
          npx --yes wrangler@4 deploy
          --config status/wrangler.toml
          --dry-run --outdir "$RUNNER_TEMP/status-bundle"

      # The apex has no code, so this is a configuration check and is worth
      # about that much. Kept because wrangler.toml's own comments record the
      # one time it earned its keep: a `[[routes]]` table array swallowed
      # `not_found_handling`, which would have quietly stopped serving the 404
      # page on the URLs Stripe holds, and wrangler refusing the file was the
      # only thing that caught it.
      - name: Validate the apex Worker's configuration
        run: >
          npx --yes wrangler@4 deploy
          --dry-run --outdir "$RUNNER_TEMP/apex-bundle"

      # A BUDGET, NOT THE LIMIT. Cloudflare's is 3 MB compressed and wrangler
      # does not enforce it on a dry run -- a deliberately bloated bundle
      # reported 8.8 MB gzipped and exited 0. This page is about 43 KB, so a
      # 1 MB budget is twenty times its current size and a third of the real
      # ceiling: loose enough never to argue with an honest change, tight
      # enough to fail the day somebody vendors a library into the one Worker
      # whose whole argument is that it has no dependencies.
      #
      # Raising it is a normal thing to do and should be done in a commit that
      # says what arrived and why it is worth the bytes on a page read during
      # an outage.
      - name: Check the bundle against its size budget
        run: |
          bundle="$RUNNER_TEMP/status-bundle/index.js"
          gzipped=$(gzip -9 -c "$bundle" | wc -c)
          budget=$((1024 * 1024))
          printf 'status Worker: %s bytes gzipped, budget %s\n' "$gzipped" "$budget"
          if [ "$gzipped" -gt "$budget" ]; then
            echo "::error::the status Worker is over its size budget" >&2
            exit 1
          fi

      # A `node:` built-in with no `nodejs_compat` flag bundles silently and
      # fails when workerd loads it, which is at deploy or at the first
      # request. esbuild leaves the specifier in the output when it cannot
      # resolve it to a Workers built-in, so the bundle itself is the evidence.
      #
      # This is a CONSISTENCY check, not a ban: add the flag to wrangler.toml
      # and the import is fine. What it refuses is the combination, which is
      # the one that looks like it works right up until it is deployed.
      - name: Refuse a Node built-in without the flag that makes it work
        run: |
          bundle="$RUNNER_TEMP/status-bundle/index.js"
          if grep -qE '(from ?"node:|require\("node:)' "$bundle"; then
            if ! grep -q 'nodejs_compat' status/wrangler.toml; then
              echo "::error::the bundle imports a node: built-in and status/wrangler.toml has no nodejs_compat flag" >&2
              grep -oE '(from ?"node:[a-z/]*|require\("node:[a-z/]*)' "$bundle" | sort -u >&2
              exit 1
            fi
          fi

  # THE DEPLOY, AND THE THING NOBODY HAD WRITTEN DOWN (#305).
  #
  # status.vrcverify.com had no deploy at all. #302 translated the page into
  # twelve languages, merged with eight green checks, and stayed on `main` for
  # days while the live page served English -- because `status/wrangler.toml`
  # is a separate script with a separate deploy, and "separate" turned out to
  # mean "manual" without anyone saying so.
  #
  # WHY IT LOOKED COVERED, which is the part worth remembering. `node --test`
  # runs the suite on every pull request (#297). `wrangler --dry-run` builds
  # the Worker on every pull request (#303). status/README.md has a section
  # headed "What CI does with this". All of that is true and none of it
  # publishes anything.
  #
  # THE APEX IS NOT DEPLOYED HERE and must not be. It is connected to
  # Cloudflare's own Git integration -- that is what `Workers Builds:
  # vrcverify` is on every pull request, a build AND a deploy -- so merging
  # already publishes it. A second mechanism pushing the same script would be
  # two things racing for one hostname.
  deploy-status:
    name: deploy status.vrcverify.com
    runs-on: ubuntu-latest

    # NOT ON A PULL REQUEST, and not from a fork. Secrets are unavailable to
    # both, so a guarded job is not what keeps the token safe -- GitHub does --
    # but a job that could not possibly succeed should not be queued and go
    # red on every contributor's first pull request.
    if: >-
      github.repository == 'PhillipDiCarlo/VRCVerify' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))

    # ORDERING OVER SPEED. A status page is the one surface where publishing
    # something broken is worse than publishing nothing, so this waits for all
    # four rather than starting alongside them. It costs about three minutes
    # of wall clock and buys the guarantee the whole page is built on.
    needs: [python, postgres, javascript, workers]

    # ONE DEPLOY AT A TIME, AND cancel-in-progress IS FALSE ON PURPOSE. The
    # rest of this file cancels superseded runs because a stale test result is
    # only noise. A cancelled deploy is a half-published script, which is a
    # different kind of thing entirely.
    concurrency:
      group: deploy-status-worker
      cancel-in-progress: false

    permissions:
      contents: read

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # An IDENTIFIER, NOT A CREDENTIAL, so it is a repository variable rather
      # than a secret -- the same reading `status/wrangler.toml` applies to
      # `database_id`. Reaching the account still needs the token above.
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"

    steps:
      - uses: actions/checkout@v7
        with:
          # Two commits, which covers the case this repository actually has:
          # a pull request merged to main, where `github.event.before` is the
          # merge commit's first parent and is therefore in the clone. A push
          # of several commits at once leaves `before` outside it, `git
          # cat-file` says so, and the step below falls through to deploying.
          # That is the intended direction to be wrong in.
          fetch-depth: 2

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # A MISSING SECRET SHOULD SAY SO. Without this, wrangler fails somewhere
      # inside an OAuth flow it cannot run headless, and the error names none
      # of the three things a reader would need to fix it.
      - name: Check the deploy credentials are present
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN(secret)"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID(variable)"
          if [ -n "$missing" ]; then
            echo "::error::cannot deploy: missing$missing. See 'What deploys this' in status/README.md." >&2
            exit 1
          fi

      # SKIPPING IS AN OPTIMISATION AND FAILING TO SKIP IS SAFE, so every
      # uncertain case deploys. A force push, a first push, a `before` outside
      # a two-commit clone, or a manual run all fall through to "yes", because
      # a redundant deploy of an identical script costs seventeen seconds and a
      # missed one costs another week of the page being wrong. #305 is what a
      # missed one costs.
      #
      # `status/` IS THE WHOLE INPUT, which is what makes this safe to scope at
      # all: the Worker's source, its assets, its config and its catalogs are
      # all under that directory, and nothing outside it is bundled. If that
      # ever stops being true this filter becomes a way to not ship.
      - name: Did anything under status/ change?
        id: scope
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] \
            || [ -z "$before" ] \
            || [ "$before" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "reason=cannot compare, deploying" >> "$GITHUB_OUTPUT"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$before" "${{ github.sha }}" -- status/; then
            echo "reason=nothing under status/ changed" >> "$GITHUB_OUTPUT"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "reason=status/ changed" >> "$GITHUB_OUTPUT"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Nothing to publish
        if: steps.scope.outputs.deploy == 'false'
        # The inner colon has to go, or YAML reads "Skipped" as a key.
        run: echo "Skipped, ${{ steps.scope.outputs.reason }}"

      - name: Deploy the status Worker
        if: steps.scope.outputs.deploy == 'true'
        run: npx --yes wrangler@4 deploy --config status/wrangler.toml

      # THE DEPLOY IS NOT THE EVIDENCE. wrangler reporting success means
      # Cloudflare accepted the upload, which is a different claim from the
      # hostname serving it. This is the check that would have caught #305 on
      # the day it happened, so it is the one thing here that is not optional.
      - name: Check the live page is the one that was just built
        if: steps.scope.outputs.deploy == 'true'
        run: |
          for attempt in 1 2 3 4 5; do
            sleep 5
            body=$(curl -fsS --max-time 20 https://status.vrcverify.com/ || true)
            if printf '%s' "$body" | grep -q 'rel="alternate" hreflang='; then
              echo "live page carries the language alternates"
              exit 0
            fi
            echo "attempt $attempt: not serving the new build yet"
          done
          echo "::error::deploy reported success but https://status.vrcverify.com/ is not serving it" >&2
          exit 1
