# How `pybabel extract` finds the dashboard's translatable strings (issue #97).
#
# A DEV-ONLY FILE. Nothing in this directory ships: the dashboard image copies
# src/dashboard/ and two flat modules, and the runtime reads the compiled .mo
# with the standard library's `gettext`. See requirements-dashboard.txt for why
# the internet-facing image does not grow a dependency to gain a feature.
#
# Run from the repo root:
#
#   pybabel extract -F config/other_configs/babel.cfg -o \
#       src/dashboard/translations/dashboard.pot src/dashboard
#   pybabel update  -i src/dashboard/translations/dashboard.pot \
#       -d src/dashboard/translations -D dashboard
#   pybabel compile -d src/dashboard/translations -D dashboard
#
# scripts/i18n.sh runs all three, which is the form worth using -- extracting
# without updating leaves the catalogues behind the templates, and updating
# without compiling leaves the running site behind the catalogues.

# The view modules and app.py. `_(...)` there is a callable passed in as an
# argument rather than a global, which changes nothing about extraction: the
# extractor matches on the name at the call site.
[python: **.py]

# The templates. `jinja2.ext.i18n` is what makes `{{ _("...") }}` a catalogue
# lookup at render time; naming it here is what makes the same call visible to
# the extractor at build time.
#
# `trimmed` matches the environment policy set in create_app, so a multi-line
# `{% trans %}` block collapses its indentation to single spaces in BOTH
# places. Without the flag here the msgid extracted would carry the template's
# leading whitespace and would never match the msgid looked up at runtime --
# which fails as "this string is simply not translated", with no error.
[jinja2: **/templates/**.html]
extensions=jinja2.ext.i18n
trimmed=True

# Never extracted:
#
# - static/*.js  Nothing user-facing lives there. Both scripts are progressive
#                enhancement over controls that already work without them, and
#                neither writes text into the page.
# - translations/  Its own output.
