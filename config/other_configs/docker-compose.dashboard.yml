# The web dashboard, for the public VPS (issue #65). NOT the homelab pair --
# that stays docker-compose.deploy.yml.
#
# Usage, on the VPS next to dashboard.env, cloudflared.env and certs/:
#   VRCVERIFY_VERSION=2.6.0 docker compose -f docker-compose.dashboard.yml up -d
#
# This is a TEMPLATE. The deployed copy on the VPS is named docker-compose.yml,
# so it drops the `-f` above, and it carries a header saying it is a copy of
# this file. Those two lines are the only differences, and they should stay the
# only two. Keep both in step -- the last drift between a template here and a
# deployed copy on a box left a comment explaining a control that had been
# wrong for months, because the edit was made on the server and nothing
# reviewed it.
#
# Three properties this file exists to preserve, all easy to undo by accident:
#
# 1. NEITHER SERVICE PUBLISHES A PORT. cloudflared dials out to Cloudflare and
#    reaches the dashboard over the Docker network by name. The host firewall
#    is default-deny inbound and the IONOS panel allows only Tailscale -- but
#    neither of those would save you, because published Docker ports are DNAT'd
#    in PREROUTING and never traverse the INPUT chain. The absence of `ports:`
#    is the actual control.
#
# 2. THE DASHBOARD HOLDS NO DATABASE CREDENTIAL AND NO BOT TOKEN. It asks the
#    bot for everything over mTLS. A full compromise of this box yields no
#    route to the users table. Adding DATABASE_URL here would quietly discard
#    the main reason the bot API exists.
#
#    It DOES hold Stripe's secret key and webhook signing secret, in
#    dashboard.env (issue #88). That is the intended split and not a weakening
#    of the point above: the worst those keys yield is Stripe's own dashboard
#    for this account, which is money and not identities. The bot holds no
#    Stripe credential at all, in either direction.
#
# 3. THE DASHBOARD NOW ANSWERS ONE PUBLIC, UNAUTHENTICATED ROUTE:
#    POST /stripe/webhook, authenticated by Stripe's signature rather than by a
#    session. It arrives through the same tunnel as everything else, so
#    property 1 is unchanged -- but Stripe is not a browser, and anything at
#    the edge that challenges non-browsers breaks it silently: Stripe sees a
#    403, retries for three days, and NOTHING reaches this origin, so nothing
#    appears in these logs either. A customer completes checkout, is charged,
#    and premium never switches on.
#
#    That is SECURITY_AUDIT.md A-25, and the fix is NOT the path-scoped skip
#    rule this comment used to describe. Measured 2026-08-15: the challenge
#    came from Bot Fight Mode, the free tier's zone-wide toggle, which has no
#    per-path exceptions and which a WAF Skip action cannot target -- Skip
#    reaches Super Bot Fight Mode, which is a paid feature. So it was inverted
#    instead. Bot Fight Mode OFF, replaced by an explicit Managed Challenge on
#    the only two paths section 4.2 says it was earning its place on:
#
#      (http.host eq "dashboard.vrcverify.com"
#       and http.request.uri.path in {"/login" "/callback"})
#
#    That leaves /stripe/webhook clean by construction rather than by
#    exception -- there is no skip expression left to write too broadly.
#
#    Verify with scripts/test_a25_webhook_skip.ps1 BEFORE STRIPE_ENABLED is
#    set here. It sends Stripe's REAL User-Agent, because an arbitrary agent
#    is never challenged and a green result from one measures nothing; and it
#    requires /login and /callback to STILL be challenged, so turning the
#    protection off cannot pass as having fixed this. The script tests the
#    edge only. A real test-mode event reaching the origin is what settles it.
#
#    With STRIPE_ENABLED unset the route is not registered at all -- a plain
#    404 -- so this file is safe to deploy ahead of any of that.

services:
  dashboard:
    image: italiandogs/vrcverify-dashboard:${VRCVERIFY_VERSION:?Set VRCVERIFY_VERSION to a pushed version tag (never latest)}
    # Everything comes from dashboard.env, with no `environment:` block to keep
    # in step with it. That includes the four Stripe variables: STRIPE_ENABLED,
    # STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET and STRIPE_PRODUCT_ID -- see
    # dashboard.env.example. (STRIPE_PRODUCT_ID replaced three STRIPE_PRICE_*
    # variables. Stripe is the catalogue: creating a price publishes a plan,
    # and that price's own metadata carries its label, order, saving and trial
    # length.) With STRIPE_ENABLED set the dashboard REFUSES TO BOOT if any of
    # the other three is missing, which is deliberate: a webhook secret that is
    # absent rejects every event Stripe sends while the service looks perfectly
    # healthy doing it.
    env_file:
      - dashboard.env
    volumes:
      # The client certificate, its key, and the CA that signed the bot's.
      - ./certs:/certs:ro
      # Sessions. A named volume so `docker compose down` doesn't sign
      # everyone out.
      - dashboard-sessions:/data
    # `always`, matching cloudflared below. Same reasoning: on 2026-08-16 a
    # compose command stopped BOTH containers 291ms apart and neither came
    # back for 11 hours. Leaving the two services on different policies also
    # means a reboot could bring the tunnel up in front of a dead dashboard,
    # which serves 502s instead of an obvious outage -- worse to diagnose than
    # either being down.
    restart: always
    # No new privileges, no capabilities, non-root user (from the Dockerfile).
    # The filesystem stays writable only where it must: /data.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    # Pinned, for the same reason the dashboard image is: `latest` moves under
    # you on any pull, and this container is the only thing standing between
    # the hostname and Cloudflare error 1033. Bump it deliberately and watch
    # the log once after -- an unattended connector version change is not a
    # thing you want to discover from a user.
    image: cloudflare/cloudflared:2026.8.2
    command: tunnel --no-autoupdate run
    env_file:
      - cloudflared.env
    depends_on:
      - dashboard
    # `always`, NOT `unless-stopped`. On 2026-08-15 this container took a
    # SIGTERM at 10:10:57Z, exited 0, and stayed down for 17h43m: the site
    # served error 1033 the whole time while the VPS, the tailnet and the
    # dashboard container all looked perfectly healthy. `unless-stopped` is
    # what kept it down -- Docker records a clean stop as operator intent and
    # will not restart it, not even across a reboot.
    #
    # Be honest about what this line does and does not buy: NEITHER policy
    # restarts a container you stopped by hand while the daemon keeps running.
    # `always` only closes the reboot half of that hole. The other half is
    # closed by deploying through scripts/deploy_dashboard.sh, which ends in a
    # real request to the public hostname instead of assuming.
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dashboard-sessions:
