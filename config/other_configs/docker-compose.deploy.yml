# Deployment compose file -- pulls published images from Docker Hub.
#
# Security note: images are pulled by EXPLICIT version tag, never :latest.
# A mutable :latest tag means a registry-account compromise becomes code
# execution on the deploy host at the next pull. VRCVERIFY_VERSION is
# required; compose refuses to start without it.
#
# Usage (on the deploy host, next to your .env):
#   VRCVERIFY_VERSION=2.6.0 docker compose -f docker-compose.deploy.yml up -d
# or add VRCVERIFY_VERSION=2.6.0 to the .env file.
#
# This file is complete: `docker compose up -d` on the homelab needs no flags,
# no overlay and no hand-editing. That is deliberate. It used to ship with the
# bot API's host networking and certs mount commented out, to be uncommented on
# the box -- and on 2026-08-19 the host copy was replaced with this template,
# both lines went with it, and the bot API disappeared. The bot itself ran
# perfectly throughout while the dashboard logged "Connection refused" with
# nothing explaining why; it took four rounds of digging to find.
#
# Configuration only one machine needs still belongs in that machine's .env,
# which is not in git. Configuration the deployment always needs belongs here,
# uncommented, where a redeploy cannot lose it.

services:
  discord-bot:
    image: italiandogs/vrcverify-discord-bot:${VRCVERIFY_VERSION:?Set VRCVERIFY_VERSION to a pushed version tag (never latest)}
    env_file:
      - .env
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_QUEUE_NAME: ${RABBITMQ_QUEUE_NAME}
      RABBITMQ_RESULT_QUEUE: ${RABBITMQ_RESULT_QUEUE}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REST_TTL_SECONDS: ${REST_TTL_SECONDS:-180}
      REST_CACHE_MAX: ${REST_CACHE_MAX:-10000}
      REST_CONCURRENCY: ${REST_CONCURRENCY:-8}
      # Internal API for the web dashboard (issue #65). Unset by default, so
      # nothing binds. See .env.example before switching it on.
      BOT_API_ENABLED: ${BOT_API_ENABLED:-}
      BOT_API_BIND: ${BOT_API_BIND:-}
      BOT_API_PORT: ${BOT_API_PORT:-5002}
      BOT_API_CERT: ${BOT_API_CERT:-}
      BOT_API_KEY: ${BOT_API_KEY:-}
      BOT_API_CA: ${BOT_API_CA:-}
      BOT_API_CLIENT_CN: ${BOT_API_CLIENT_CN:-}
      BOT_API_TOKEN_SIGNING_KEY: ${BOT_API_TOKEN_SIGNING_KEY:-}
      BOT_API_ADMIN_TTL: ${BOT_API_ADMIN_TTL:-15}
      # Card subscriptions (issue #88). Unset by default, so the bot never
      # reads the stripe_subscription table and never registers the API route
      # that writes it -- premium keeps coming from Discord entitlements alone.
      #
      # NOTE: no Stripe credential appears here and none ever should.
      # STRIPE_SECRET_KEY and STRIPE_WEBHOOK_SECRET belong to the dashboard on
      # the VPS. This host reads a table that the dashboard fills in over
      # mTLS, which is the whole of Stripe's presence on the homelab.
      #
      # Turn this on BEFORE the dashboard's own STRIPE_ENABLED. The other
      # order means a customer completes checkout, is charged, and the forward
      # is answered 404 until Stripe gives up three days later.
      STRIPE_ENABLED: ${STRIPE_ENABLED:-}
      STRIPE_STATUS_TTL: ${STRIPE_STATUS_TTL:-900}
      # Issue #49's group invite. The BOT needs the invite account's usr_ id
      # too, not just the worker: it is what tells the dashboard which account
      # an admin has to invite to their group, and display names are not
      # unique -- an admin who invites a lookalike gets a "not a member"
      # failure with nothing on screen explaining why. Unset means the feature
      # refuses to start a check rather than sending someone to invite nobody.
      INVITE_VRCHAT_USER_ID: ${INVITE_VRCHAT_USER_ID:-}
      RABBITMQ_GROUP_INVITE_QUEUE: ${RABBITMQ_GROUP_INVITE_QUEUE:-vrcverify_group_invites}
      RABBITMQ_GROUP_INVITE_RESULT_QUEUE: ${RABBITMQ_GROUP_INVITE_RESULT_QUEUE:-vrcverify_group_invite_results}
      # How long a group setup check may go unanswered before the dashboard
      # stops calling it "checking" and says so.
      GROUP_VERIFY_TIMEOUT_SECONDS: ${GROUP_VERIFY_TIMEOUT_SECONDS:-120}
    restart: unless-stopped
    # Docker's json-file driver does not rotate by default, so container logs
    # grow without bound until the disk does. Especially worth having here:
    # the checker logs full VRChat bios at DEBUG (third-party PII), so an
    # accidental LOG_LEVEL=DEBUG must not also mean "forever".
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    #
    # TURNING THE API ON ALSO NEEDS THE TWO LINES BELOW UNCOMMENTED.
    # The production homelab host runs with them uncommented, and has since
    # 2026-08-13. They are commented HERE because this is the template: a
    # self-hoster with no dashboard needs neither, and host networking would
    # actively break them if DATABASE_URL or RABBITMQ_HOST names a container
    # rather than a host address.
    #
    # There is deliberately no `ports:` mapping, and there should never be one.
    # A bridged container cannot bind the host's tailnet address, so the usual
    # workaround is to listen on 0.0.0.0 inside the container and publish it as
    # `100.64.0.2:5002:5002`. The bot refuses to start on 0.0.0.0 precisely so
    # that arrangement is not available: it puts one typo (a dropped IP prefix
    # in the publish rule) between this port and the whole internet, and the
    # container itself has no idea anything is wrong.
    #
    # Host networking instead means BOT_API_BIND is a real host interface and
    # the refusal above means exactly what it says.
    #
    # Its cost is that container names stop resolving, so every address this
    # service uses must be a real host address. DATABASE_URL and RABBITMQ_HOST
    # both name IPs today, which is what makes this safe; if either ever becomes
    # a service name, this line has to go first.
    network_mode: host

    volumes:
      # The bot API's server certificate, its key, and the CA that signed the
      # dashboard's client certificate. Read-only -- the bot never writes here.
      #
      # Files must be readable by uid 10001 (the image's appuser). Ownership is
      # the usual cause of an API that validates its config, binds, and then
      # fails every handshake.
      #
      # Mounted unconditionally: where the API is switched off an unused mount
      # costs nothing, and a missing directory is created empty rather than
      # failing the start. That is cheaper than a line someone has to remember.
      - ${BOT_API_CERT_DIR:-./certs}:/certs:ro

  vrc-online-checker:
    image: italiandogs/vrcverify-vrc-online-checker:${VRCVERIFY_VERSION:?Set VRCVERIFY_VERSION to a pushed version tag (never latest)}
    env_file:
      - .env
    environment:
      RABBITMQ_QUEUE_NAME: ${RABBITMQ_QUEUE_NAME}
      RABBITMQ_RESULT_QUEUE: ${RABBITMQ_RESULT_QUEUE}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      VRCHAT_USERNAME: ${VRCHAT_USERNAME}
      VRCHAT_PASSWORD: ${VRCHAT_PASSWORD}
      GMAIL_USER: ${GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      # Kill switch for the /profile bio lookup; see README
      VRCHAT_USE_PROFILE_ENDPOINT: ${VRCHAT_USE_PROFILE_ENDPOINT:-true}
      # Reuse the VRChat session across restarts so redeploys don't burn a
      # 2FA email (and risk a 429 lockout). Unset to disable.
      VRCHAT_SESSION_FILE: ${VRCHAT_SESSION_FILE-/data/vrchat_session.txt}
    volumes:
      - vrchat-session:/data
    restart: unless-stopped
    # This is the service that logs bios at DEBUG. Rotation matters most here.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Group-invite worker (issue #49). Runs the SECOND VRChat account, which
  # joins each server's VRChat group and sends invites.
  #
  # restart: on-failure, not unless-stopped: with INVITE_* unset the worker
  # exits 0 on purpose, and "unless-stopped" would restart-loop a container
  # that has nothing to do.
  vrc-group-inviter:
    image: italiandogs/vrcverify-vrc-group-inviter:${VRCVERIFY_VERSION:?Set VRCVERIFY_VERSION to a pushed version tag (never latest)}
    env_file:
      - .env
    environment:
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Its own queues. Sharing the verification queue would have the age
      # checker consume these jobs -- two consumers on one queue get messages
      # round-robin.
      RABBITMQ_GROUP_INVITE_QUEUE: ${RABBITMQ_GROUP_INVITE_QUEUE:-vrcverify_group_invites}
      RABBITMQ_GROUP_INVITE_RESULT_QUEUE: ${RABBITMQ_GROUP_INVITE_RESULT_QUEUE:-vrcverify_group_invite_results}
      # The second VRChat account and its own 2FA mailbox. Unset = the worker
      # exits immediately and nothing else is affected.
      # Reported back with every result, so the bot records WHICH
      # invite account joined a group rather than assuming there is
      # only one.
      INVITE_VRCHAT_USER_ID: ${INVITE_VRCHAT_USER_ID:-}
      INVITE_VRCHAT_USERNAME: ${INVITE_VRCHAT_USERNAME:-}
      INVITE_VRCHAT_PASSWORD: ${INVITE_VRCHAT_PASSWORD:-}
      INVITE_GMAIL_USER: ${INVITE_GMAIL_USER:-}
      INVITE_GMAIL_APP_PASSWORD: ${INVITE_GMAIL_APP_PASSWORD:-}
      INVITE_VRCHAT_SESSION_FILE: ${INVITE_VRCHAT_SESSION_FILE-/data/vrchat_invite_session.txt}
    volumes:
      - vrchat-invite-session:/data
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Persists the VRChat auth cookie so restarts skip re-authentication.
  vrchat-session:
  # The invite account's cookie, deliberately not the same volume.
  vrchat-invite-session:
