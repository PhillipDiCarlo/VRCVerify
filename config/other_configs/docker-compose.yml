# Local build compose. Produces all three images; only two are meant to run
# here (see the dashboard service at the bottom).
#
# No `version:` key: Compose v2 ignores it and warns that it is obsolete on
# every single invocation. The other two files in this directory never had one.

services:
  discord-bot:
    build:
      context: ../../
      dockerfile: docker/Dockerfile-bot
    image: discord-bot
    env_file:
      - .env
    environment:
      # Required by bot.py
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_QUEUE_NAME: ${RABBITMQ_QUEUE_NAME}
      RABBITMQ_RESULT_QUEUE: ${RABBITMQ_RESULT_QUEUE}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      # Optional tuning flags used by the bot
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REST_TTL_SECONDS: ${REST_TTL_SECONDS:-180}
      REST_CACHE_MAX: ${REST_CACHE_MAX:-10000}
      REST_CONCURRENCY: ${REST_CONCURRENCY:-8}
    restart: unless-stopped

  vrc-online-checker:
    build:
      context: ../../
      dockerfile: docker/Dockerfile-online-checker
    image: vrc-online-checker
    env_file:
      - .env
    environment:
      # Shared infra
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_QUEUE_NAME: ${RABBITMQ_QUEUE_NAME}
      RABBITMQ_RESULT_QUEUE: ${RABBITMQ_RESULT_QUEUE}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # VRChat + Gmail (checker needs these)
      VRCHAT_USERNAME: ${VRCHAT_USERNAME}
      VRCHAT_PASSWORD: ${VRCHAT_PASSWORD}
      GMAIL_USER: ${GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      # Kill switch for the /profile bio lookup; see README
      VRCHAT_USE_PROFILE_ENDPOINT: ${VRCHAT_USE_PROFILE_ENDPOINT:-true}
      # Reuse the VRChat session across restarts so redeploys don't burn a
      # 2FA email (and risk a 429 lockout). Unset to disable.
      VRCHAT_SESSION_FILE: ${VRCHAT_SESSION_FILE-/data/vrchat_session.txt}
    volumes:
      - vrchat-session:/data
    restart: unless-stopped

  # BUILD TARGET ONLY -- do not `up` this here.
  #
  # The dashboard runs on the public VPS, not the homelab, and it needs
  # DISCORD_CLIENT_SECRET, the mTLS client certificate and a session volume
  # that only exist there. It lives in this file so `docker compose build`
  # produces the image alongside the other two and the version tags stay in
  # step; run it from docker-compose.dashboard.yml on the VPS.
  #
  # Started here by accident it would simply refuse to boot -- DashboardConfig
  # fails closed on the first missing setting -- which is the intended failure.
  dashboard:
    build:
      context: ../../
      dockerfile: docker/Dockerfile-dashboard
    image: dashboard

volumes:
  # Persists the VRChat auth cookie so restarts skip re-authentication.
  vrchat-session:
