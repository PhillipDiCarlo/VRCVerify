# Local build compose. Produces all four images; three are meant to run here
# (see the dashboard service at the bottom).
#
# No `version:` key: Compose v2 ignores it and warns that it is obsolete on
# every single invocation. The other two files in this directory never had one.

services:
  discord-bot:
    build:
      context: ../../
      dockerfile: docker/Dockerfile-bot
    image: discord-bot
    env_file:
      - .env
    environment:
      # Required by bot.py
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_QUEUE_NAME: ${RABBITMQ_QUEUE_NAME}
      RABBITMQ_RESULT_QUEUE: ${RABBITMQ_RESULT_QUEUE}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      # Optional tuning flags used by the bot
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REST_TTL_SECONDS: ${REST_TTL_SECONDS:-180}
      REST_CACHE_MAX: ${REST_CACHE_MAX:-10000}
      REST_CONCURRENCY: ${REST_CONCURRENCY:-8}
      # Issue #49's group invite. The bot needs the invite account's usr_ id
      # too, not just the worker: it is what tells the dashboard which account
      # an admin has to invite. Unset means the feature refuses to start a
      # check rather than sending someone to invite nobody.
      INVITE_VRCHAT_USER_ID: ${INVITE_VRCHAT_USER_ID:-}
      RABBITMQ_GROUP_INVITE_QUEUE: ${RABBITMQ_GROUP_INVITE_QUEUE:-vrcverify_group_invites}
      RABBITMQ_GROUP_INVITE_RESULT_QUEUE: ${RABBITMQ_GROUP_INVITE_RESULT_QUEUE:-vrcverify_group_invite_results}
      GROUP_VERIFY_TIMEOUT_SECONDS: ${GROUP_VERIFY_TIMEOUT_SECONDS:-120}
      # The same, for ONE member's invite: how long they watch "asking
      # VRChat" before being told it did not work.
      GROUP_INVITE_TIMEOUT_SECONDS: ${GROUP_INVITE_TIMEOUT_SECONDS:-90}
      # Minimum gap between two invite attempts by the same member. Bounds
      # retries after a transient failure, where the member gets their button
      # back; the settled outcomes need no timer.
      GROUP_INVITE_COOLDOWN_SECONDS: ${GROUP_INVITE_COOLDOWN_SECONDS:-300}
      # Issue #49 phase 6 -- seats. A VRChat account can be in 100 groups (200
      # with VRC+), and that cap is the scarcest thing this feature has.
      #
      # INVITE_ACCOUNTS is the roster: usr_id|queue|seats per entry, seats
      # optional, entries comma-separated. Leave it UNSET while there is one
      # account -- the bot then builds a one-entry roster from
      # INVITE_VRCHAT_USER_ID and RABBITMQ_GROUP_INVITE_QUEUE, which is exactly
      # what this file already configures.
      #
      # Each account needs its OWN queue. Two workers on one queue split its
      # messages round-robin, so an invite for a group only the second account
      # joined would be handed to the first.
      INVITE_ACCOUNTS: ${INVITE_ACCOUNTS:-}
      INVITE_ACCOUNT_SEAT_CAP: ${INVITE_ACCOUNT_SEAT_CAP:-100}
      # How long a server may go without a subscription before the bot leaves
      # its group and the seat returns to the pool. Their configuration
      # survives -- coming back is "invite the bot again and press check", not
      # a full re-setup.
      SEAT_LAPSE_GRACE_SECONDS: ${SEAT_LAPSE_GRACE_SECONDS:-7776000}
      # A seat promised to an admin who never finished setting up.
      SEAT_RESERVATION_GRACE_SECONDS: ${SEAT_RESERVATION_GRACE_SECONDS:-2592000}
      # Warn in the log while there is still time to provision another account.
      SEAT_CAPACITY_WARN_FREE: ${SEAT_CAPACITY_WARN_FREE:-10}
      SEAT_SWEEP_INTERVAL: ${SEAT_SWEEP_INTERVAL:-21600}
      SEAT_SWEEP_MAX_PER_PASS: ${SEAT_SWEEP_MAX_PER_PASS:-25}
      SEAT_SWEEP_SPACING: ${SEAT_SWEEP_SPACING:-2}
    restart: unless-stopped

  vrc-online-checker:
    build:
      context: ../../
      dockerfile: docker/Dockerfile-online-checker
    image: vrc-online-checker
    env_file:
      - .env
    environment:
      # Shared infra
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_QUEUE_NAME: ${RABBITMQ_QUEUE_NAME}
      RABBITMQ_RESULT_QUEUE: ${RABBITMQ_RESULT_QUEUE}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # VRChat + Gmail (checker needs these)
      VRCHAT_USERNAME: ${VRCHAT_USERNAME}
      VRCHAT_PASSWORD: ${VRCHAT_PASSWORD}
      GMAIL_USER: ${GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      # Kill switch for the /profile bio lookup; see README
      VRCHAT_USE_PROFILE_ENDPOINT: ${VRCHAT_USE_PROFILE_ENDPOINT:-true}
      # Reuse the VRChat session across restarts so redeploys don't burn a
      # 2FA email (and risk a 429 lockout). Unset to disable.
      VRCHAT_SESSION_FILE: ${VRCHAT_SESSION_FILE-/data/vrchat_session.txt}
    volumes:
      - vrchat-session:/data
    restart: unless-stopped

  # Group-invite worker (issue #49). Runs the SECOND VRChat account, which
  # joins each server's VRChat group and sends invites.
  #
  # restart: on-failure, not unless-stopped: with INVITE_* unset the worker
  # exits 0 on purpose, and "unless-stopped" would restart-loop a container
  # that has nothing to do.
  vrc-group-inviter:
    build:
      context: ../../
      dockerfile: docker/Dockerfile-invite-worker
    image: vrc-group-inviter
    env_file:
      - .env
    environment:
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Its own queues. Sharing the verification queue would have the age
      # checker consume these jobs -- two consumers on one queue get messages
      # round-robin.
      RABBITMQ_GROUP_INVITE_QUEUE: ${RABBITMQ_GROUP_INVITE_QUEUE:-vrcverify_group_invites}
      RABBITMQ_GROUP_INVITE_RESULT_QUEUE: ${RABBITMQ_GROUP_INVITE_RESULT_QUEUE:-vrcverify_group_invite_results}
      # Minimum gap between two invites this account sends to anyone, with
      # jitter on top. One account serves every guild, so throughput is a
      # shared budget and a server running a verification drive must not be
      # able to spend it in a burst -- which is also the pattern VRChat's
      # Creator Guidelines describe as abuse.
      INVITE_MIN_SPACING_SECONDS: ${INVITE_MIN_SPACING_SECONDS:-3}
      # The second VRChat account and its own 2FA mailbox. Unset = the worker
      # exits immediately and nothing else is affected.
      # Reported back with every result, so the bot records WHICH invite
      # account joined a group rather than assuming there is only one.
      INVITE_VRCHAT_USER_ID: ${INVITE_VRCHAT_USER_ID:-}
      INVITE_VRCHAT_USERNAME: ${INVITE_VRCHAT_USERNAME:-}
      INVITE_VRCHAT_PASSWORD: ${INVITE_VRCHAT_PASSWORD:-}
      INVITE_GMAIL_USER: ${INVITE_GMAIL_USER:-}
      INVITE_GMAIL_APP_PASSWORD: ${INVITE_GMAIL_APP_PASSWORD:-}
      INVITE_VRCHAT_SESSION_FILE: ${INVITE_VRCHAT_SESSION_FILE-/data/vrchat_invite_session.txt}
    volumes:
      - vrchat-invite-session:/data
    restart: on-failure

  # BUILD TARGET ONLY -- do not `up` this here.
  #
  # The dashboard runs on the public VPS, not the homelab, and it needs
  # DISCORD_CLIENT_SECRET, the mTLS client certificate and a session volume
  # that only exist there. It lives in this file so `docker compose build`
  # produces the image alongside the other two and the version tags stay in
  # step; run it from docker-compose.dashboard.yml on the VPS.
  #
  # Started here by accident it would simply refuse to boot -- DashboardConfig
  # fails closed on the first missing setting -- which is the intended failure.
  dashboard:
    build:
      context: ../../
      dockerfile: docker/Dockerfile-dashboard
    image: dashboard

volumes:
  # Persists the VRChat auth cookie so restarts skip re-authentication.
  vrchat-session:
  # The invite account's cookie, deliberately not the same volume.
  vrchat-invite-session:
